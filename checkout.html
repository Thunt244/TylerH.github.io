<body>
    <main class="checkout-page">
        <h2>Complete Your Order</h2>

        <div class="checkout-container">

            <!-- LEFT: Order Summary -->
            <div class="order-summary">
                <h3>Your Order</h3>
                <div id="orderReview"></div>
            </div>

            <!-- RIGHT: Form -->
            <div class="checkout-form">
                <form id="checkoutForm" onsubmit="handleSubmit(event)">
    
                    <div class="checkout-form-container">

                        <!-- BILLING INFORMATION -->
                        <div>
                            <h3>Billing Information</h3>
                            <div class="form-group">
                                <label>Full Name:</label>
                                <input type="text" id="billingName" required>
                            </div>
                            <div class="form-group">
                                <label>Email:</label>
                                <input type="email" id="billingEmail" required>
                            </div>
                            <div class="form-group">
                                <label>Phone:</label>
                                <input type="tel" id="billingPhone" required>
                            </div>
                            <div class="form-group">
                                <label>Address:</label>
                                <input type="text" id="billingAddress" required>
                            </div>
                            <div class="form-group">
                                <label>City:</label>
                                <input type="text" id="billingCity" required>
                            </div>
                            <div class="form-group">
                                <label>State:</label>
                                <input type="text" id="billingState" maxlength="2" placeholder="TX" required>
                            </div>
                            <div class="form-group">
                                <label>Zip Code:</label>
                                <input type="text" id="billingZip" required maxlength="10">
                            </div>
                        </div>

                        <!-- SHIPPING INFORMATION -->
                        <div>
                            <h3>Shipping Information</h3>
                            <button type="button" onclick="copyBillingToShipping()" class="copy-btn">
                                Copy Billing to Shipping →
                            </button>
                            
                            <div class="form-group">
                                <label>Full Name:</label>
                                <input type="text" id="shippingName" required>
                            </div>
                            <div class="form-group">
                                <label>Address:</label>
                                <input type="text" id="shippingAddress" required>
                            </div>
                            <div class="form-group">
                                <label>City:</label>
                                <input type="text" id="shippingCity" required>
                            </div>
                            <div class="form-group">
                                <label>State:</label>
                                <input type="text" id="shippingState" maxlength="2" placeholder="TX" required>
                            </div>
                            <div class="form-group">
                                <label>Zip Code:</label>
                                <input type="text" id="shippingZip" required maxlength="10">
                            </div>
                        </div>

                    </div>

                    <div class="form-buttons">
                        <button type="button" onclick="goBack()">← Back to Shop</button>
                        <button type="submit">Place Order</button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
